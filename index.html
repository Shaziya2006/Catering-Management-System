<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anapoorna Catering</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <h1>Anapoorna Catering</h1>
    <nav id="nav">
      <button data-page="dashboard" class="active">Dashboard</button>
      <button data-page="customers">Customers</button>
      <button data-page="menus">Menus</button>
      <button data-page="events">Events</button>
      <button data-page="orders">Orders</button>
      <button data-page="payments">Payments</button>
    </nav>
  </aside>

  <main>
    <header class="top">
      <h2 id="title"></h2>
      <button id="addBtn" class="primary">+ Add new</button>
    </header>
    <section id="content"></section>
  </main>

  <dialog id="modal">
    <form id="form">
      <h3 id="formTitle"></h3>
      <div id="formFields"></div>
      <div class="actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
